; EnergyLab - firmware du kit (ESP32 DevKit V1 / ESP32-WROOM-32, 4 Mo)
;
; Compilation et téléversement (VS Code + PlatformIO) :
;   pio run -t upload        (l'application web est intégrée automatiquement au firmware)
;   pio device monitor       (journal série à 115200 bauds)

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions_energylab.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=12288
    -DWS_MAX_QUEUED_MESSAGES=16
    -DDEFAULT_MAX_WS_CLIENTS=8
extra_scripts = pre:tools/embed_web.py
lib_ldf_mode = deep+

[env:esp32dev]
lib_deps =
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0
    bblanchon/ArduinoJson@7.4.3
    olikraus/U8g2@2.36.19
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    knolleary/PubSubClient@2.8

; Variante hors-ligne : bibliothèques déjà présentes dans le dossier indiqué par EL_LIBS
[env:esp32dev-offline]
lib_extra_dirs = ${sysenv.EL_LIBS}
